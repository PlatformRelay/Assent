# SonarQube Cloud (SonarCloud) analysis configuration — D-150, implemented by D-177.
#
# WHY THIS FILE EXISTS. Automatic Analysis (the zero-config GitHub App mode) cannot
# express per-rule exclusions, so D-150 chose a checked-in properties file to exempt
# table-driven Go tests from the cognitive-complexity rule. A properties file and
# Automatic Analysis are mutually exclusive: the presence of this file IS the switch
# to CI-based analysis. The scanner step lives in .github/workflows/verify.yaml and
# is pinned by hack/lint/workflow_pins_test.sh — deleting either half silently ends
# analysis, which is exactly how this project went a month unscanned (D-177).
#
# The project key is deliberately the LOWERCASE `assent` even though the GitHub repo
# was renamed to `Assent`: SonarCloud's project key is immutable and independent of
# the repo name, its display name already tracked the rename, and no project exists
# under the capitalised key. Changing this line creates a SECOND project and orphans
# every historical measurement. Verified 2026-09-05 via api/components/show.
sonar.projectKey=PlatformRelay_assent
sonar.organization=platformrelay

# Go layout. sonar.sources and sonar.tests must not overlap or the scanner errors,
# so the test glob is excluded from sources and re-declared as tests.
sonar.sources=.
sonar.exclusions=**/*_test.go,**/testdata/**,bin/**,dist/**,site/**,vendor/**,node_modules/**,.venv*/**,.task/**,.worktrees/**,.claude/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/testdata/**,.worktrees/**,.claude/**

# Written by `task coverage`, which runs immediately before the scanner step.
# The path is relative to sonar.projectBaseDir. If the coverage step is ever moved
# after this one, coverage silently reports as 0% rather than failing.
sonar.go.coverage.reportPaths=cov.out

# D-150 — the exclusion this whole file was cut for. 34 go:S3776 hits sit in
# table-driven `*_test.go` suites, which are legitimately long by line count and low
# by risk; high cognitive complexity is the idiom there, not a defect. Chosen over
# the UI-only Won't-Fix route (not reviewable in-tree, does not survive a project
# re-import) and over refactoring 34 passing test files for a non-gating metric.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go

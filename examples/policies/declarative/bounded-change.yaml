# Bounded-change envelope rule (ADR-0010/0013 / ADR-0017 §2/§5): one prove predicate,
# both outcomes via onFailure — no negation-pair twin rules. Over-quota is
# acknowledgement (challenge), not an authorization gap.
# Partition increases within quota are safe; decreases are not possible in Kafka.
apiVersion: assent.dev/v1alpha1
kind: MergePolicy
metadata:
  name: bounded-change-partitions
spec:
  rules:
    - name: partition-change-bounds
      match:
        valueChanges:
          pointers: ["/partitions"]
          kinds: [modify]
      prove:
        obligation: bounded-change
        when:
          all:
            - cel: new >= old
              message: "partitions may not decrease ({{ old }} -> {{ new }})"
            - cel: new <= facts.quota.max_partitions
              message: "partitions {{ new }} exceeds quota {{ facts.quota.max_partitions }}"
      points: 1              # accrues PER FIRING: many bumps in one MR add up (bulk guard)
      onFailure:
        effect: challenge    # predicate false -> the failing leaf's message explains why
        code: bounded-change.out-of-band

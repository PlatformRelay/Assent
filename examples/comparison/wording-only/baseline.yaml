apiVersion: assent.dev/v1alpha1
kind: MergePolicy
metadata:
  name: prod-strict@6
spec:
  rules:
    - name: non-destructive
      phase: enforce
      match:
        valueChanges:
          pointers: ["/partitions"]
          kinds: [modify]
      prove:
        obligation: non-destructive
        when:
          cel: "new >= old"
          message: "partitions must not shrink below the baseline"
      onFailure:
        effect: block
        code: partitions.shrunk

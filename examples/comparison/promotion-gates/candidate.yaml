apiVersion: assent.dev/v1alpha1
kind: MergePolicy
metadata:
  name: prod-strict@7
spec:
  rules:
    - name: non-destructive
      phase: enforce
      match:
        valueChanges:
          pointers: ["/partitions"]
          kinds: [modify]
      prove:
        obligation: non-destructive
        when:
          cel: "true"
          message: "partitions may change"
      onFailure:
        effect: block
        code: partitions.shrunk
    - name: owner-ok
      phase: enforce
      match:
        values:
          pointers: ["/owner"]
      prove:
        obligation: ownership
        when:
          cel: "true"
          message: "owner must be present"
      onFailure:
        effect: require-review
        code: owner-missing
    - name: soft-bump
      phase: enforce
      points: 1
      match:
        values:
          pointers: ["/p0", "/p1", "/p2", "/p3", "/p4"]
      prove:
        obligation: signal
        when:
          cel: "new >= old"
          message: "soft bump"
      onFailure:
        effect: comment
        code: value-bumped
    # AUD2-S04 (REQ-AUD2-S04-03): a challenge-effect intervention the baseline
    # profile does not carry. It matches only the challenge-intervention-added
    # case's /retentionMs pointer, so the other corpus cases are untouched.
    - name: retention-ack
      phase: enforce
      match:
        valueChanges:
          pointers: ["/retentionMs"]
          kinds: [modify]
      prove:
        obligation: retention-ack
        when:
          cel: "new >= old"
          message: "retention must not shrink without an acknowledged challenge"
      onFailure:
        effect: challenge
        code: retention.shrunk

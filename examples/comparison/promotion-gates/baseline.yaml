apiVersion: assent.dev/v1alpha1
kind: MergePolicy
metadata:
  name: prod-strict@6
spec:
  rules:
    - name: non-destructive
      phase: enforce
      match:
        valueChanges:
          pointers: ["/partitions"]
          kinds: [modify]
      prove:
        obligation: non-destructive
        when:
          cel: "new >= old"
          message: "partitions must not shrink"
      onFailure:
        effect: block
        code: partitions.shrunk
    - name: owner-ok
      phase: enforce
      match:
        values:
          pointers: ["/owner"]
      prove:
        obligation: ownership
        when:
          cel: "true"
          message: "owner must be present"
      onFailure:
        effect: require-review
        code: owner-missing
    - name: soft-bump
      phase: enforce
      points: 2
      match:
        values:
          pointers: ["/p0", "/p1", "/p2", "/p3", "/p4"]
      prove:
        obligation: signal
        when:
          cel: "new >= old"
          message: "soft bump"
      onFailure:
        effect: comment
        code: value-bumped
    # RVW-S02: the baseline must GOVERN a /retentionMs edit for it to be a valid
    # APPROVE side. Before the unmatched-edit escalation it approved /retentionMs
    # only because no rule matched it — the fail-open this corpus case accidentally
    # depended on. This permissive rule proves a required obligation cleanly true,
    # so the baseline genuinely permits retention changes; the candidate's
    # retention-ack challenge is then a real stricter-intervention-added delta.
    - name: retention-permissive
      phase: enforce
      match:
        valueChanges:
          pointers: ["/retentionMs"]
          kinds: [modify]
      prove:
        obligation: non-destructive
        when:
          cel: "true"
          message: "baseline permits retention changes"
      onFailure:
        effect: block
        code: retention.shrunk

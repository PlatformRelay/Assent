# EFE-S04 / D-061 — whole-file catalog lifecycle (null side = absent).
# Reconciles archetype no-destruction/delete → BLOCK; entry-removal stays REVIEW.
cases:
  # File-ADD proving polarity for no-catalog-file-deletion.
  - name: file-non-destructive
    file: catalog/dev/new-team-services.json
    base: null
    head:
      apiVersion: catalog/v1
      services:
        - name: reports-api
          owner: orders-team
          tier: 1
          oncall: reports-rotation
          sla: { slo_percent: 99.9, window: 30d }
          runtime: { language: go, replicas: 3 }
    facts:
      author: { login: alice, groups: [orders-team] }
      oncall: { orders_rotation: ready, reports_rotation: ready }
      schema: { valid: true }
    expect:
      decision: APPROVE
      findings: []

  # File-DELETE failing polarity → BLOCK per archetype-goldens no-destruction/delete.
  - name: file-non-destructive-delete
    file: catalog/prod/core-services.json
    base:
      apiVersion: catalog/v1
      services:
        - name: orders-api
          owner: orders-team
          tier: 1
          oncall: orders-rotation
          sla: { slo_percent: 99.9, window: 30d }
          runtime: { language: go, replicas: 3 }
        - name: payments-gateway
          owner: payments-team
          tier: 1
          oncall: payments-rotation
          sla: { slo_percent: 99.9, window: 30d }
          runtime: { language: go, replicas: 3 }
        - name: storefront-web
          owner: storefront-team
          tier: 2
          oncall: storefront-rotation
          sla: { slo_percent: 99.9, window: 30d }
          runtime: { language: go, replicas: 3 }
    head: null
    facts:
      author: { login: alice, groups: [orders-team] }
      oncall: { orders_rotation: ready }
      schema: { valid: true }
    expect:
      decision: BLOCK
      findings:
        - rule: no-catalog-file-deletion
          obligation: non-destructive
          effect: block

# Non-destructive — whole-entry REMOVAL from the multi-entry catalog file requires
# human review. Matches ENTRY-level changes (identity.pointer=/name keeps the EntryRef
# stable, so a reorder is not a change); an entry ADD PROVES (kind != delete) and a
# DELETE FAILS (require-review) — exercisable in BOTH polarities. A field modify lives
# at the deeper /services/<name>/<field> pointer, so it is not matched by this rule.
apiVersion: assent.dev/v1alpha1
kind: MergePolicy
metadata:
  name: catalog-non-destructive
spec:
  entries:
    catalog-service:
      mode: list
      root: /services
      identity:
        pointer: /name
  rules:
    - name: no-entry-removal
      phase: enforce
      match:
        valueChanges:
          pointers: ["/services/*"]
          kinds: [add, delete]
      prove:
        obligation: non-destructive
        when: 'kind != "delete"'
      onFailure:
        effect: require-review
        code: destruction.forbidden

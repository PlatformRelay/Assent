# Allow-listed fields — only /oncall may change freely for automerge; a change to any
# other field (e.g. /owner, /tier) escalates to require-review (P1-E2 inventory).
#
# Provable allow-list (not a constant-false deny): a matched field change PROVES when
# the changed pointer is the safe /oncall field and FAILS (require-review) for a
# sensitive one — so the rule is exercisable in BOTH polarities (`assent test
# --coverage`), which a `when: false` deny predicate never is (it can only ever fire).
apiVersion: assent.dev/v1alpha1
kind: MergePolicy
metadata:
  name: catalog-allowed-fields
spec:
  entries:
    catalog-service:
      mode: list
      root: /services
      identity:
        pointer: /name
  rules:
    - name: only-safe-fields
      phase: enforce
      match:
        valueChanges:
          pointers: ["/services/*/*"]
          kinds: [modify]
      prove:
        obligation: allowed-fields
        when: 'path.endsWith("/oncall")'
      onFailure:
        effect: require-review
        code: allowed-fields.sensitive

# Ownership — same obligation/effect as S01 declarative ownership example.
apiVersion: assent.dev/v1alpha1
kind: MergePolicy
metadata:
  name: catalog-ownership
spec:
  entries:
    catalog-service:
      mode: list
      root: /services
      identity:
        pointer: /name
  rules:
    - name: author-owns-entry
      phase: enforce
      match:
        files:
          paths: ["catalog/**/*.json"]
      prove:
        obligation: ownership
        when: "entry.owner in facts.author.groups.value"
      onFailure:
        effect: require-review
        code: ownership.unauthorized

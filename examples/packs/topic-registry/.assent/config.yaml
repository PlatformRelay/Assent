# Starter pack for examples/repos/topic-registry. Copy this .assent/ tree into your
# repo root (there is no `assent init` subcommand — see docs/usage/walkthrough.md).
# Class kafka-topic: one YAML file per topic; map-at-root identity = the topic-name key
# (EFE-S04: document mode leaves Entry nil under whole-pack replay — D-056 — so
# entry.owner cannot bind; map mode reconstructs the topic object for ownership).
apiVersion: assent.dev/v1alpha1
kind: Config
environments:
  - name: prod
    match: { paths: ["topics/prod/**"] }
  - name: dev
    match: { paths: ["topics/**"] } # last match wins as default
classes:
  - name: kafka-topic
    match: { paths: ["topics/**/*.yaml"] }
providers:
  author:
    type: builtin/gitlab-groups
    failure: closed
  quota:
    type: http
    url: https://quota.example.com/api/v1/lookup
    failure: closed

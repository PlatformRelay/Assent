# Ownership — reused from examples/policies/declarative/ownership.yaml (S01).
# Authorization via ApprovalEvidence only; author self-resolve must not satisfy.
# Map-at-root (identity = map key): document mode leaves Entry nil under whole-pack
# replay (D-056), so entry.owner cannot bind; map mode reconstructs the topic object.
apiVersion: assent.dev/v1alpha1
kind: MergePolicy
metadata:
  name: topics-ownership
spec:
  entries:
    kafka-topic:
      mode: map
      root: ""
  rules:
    - name: author-owns-entry
      phase: enforce
      match:
        files:
          paths: ["topics/**/*.yaml"]
      prove:
        obligation: ownership
        when: "entry.owner in facts.author.groups.value"
      onFailure:
        effect: require-review
        code: ownership.unauthorized

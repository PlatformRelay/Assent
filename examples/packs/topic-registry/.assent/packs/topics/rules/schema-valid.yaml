# Schema validity — obligation schema-valid (P1-E2 schema-validity archetype).
apiVersion: assent.dev/v1alpha1
kind: MergePolicy
metadata:
  name: topics-schema-valid
spec:
  entries:
    kafka-topic:
      mode: document
      root: ""
      identity:
        pointer: /name
  rules:
    - name: topic-schema-v1
      phase: enforce
      match:
        files:
          paths: ["topics/**/*.yaml"]
      prove:
        obligation: schema-valid
        when: "facts.schema.valid.value"
      onFailure:
        effect: block
        code: schema.invalid

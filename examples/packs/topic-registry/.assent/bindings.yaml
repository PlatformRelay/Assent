apiVersion: assent.dev/v1alpha1
kind: RulesetBinding
bindings:
  - class: kafka-topic
    environment: dev
    packs: [topics]
    risk: { threshold: 10 }
    require: [ownership, bounded-change, non-destructive, schema-valid]
  - class: kafka-topic
    environment: prod
    packs: [topics]
    risk: { threshold: 4 }
    require: [ownership, bounded-change, non-destructive, schema-valid]

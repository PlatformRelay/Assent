# Starter pack for examples/repos/infra-vars. Copy this .assent/ tree into your
# repo root (there is no `assent init` subcommand — see docs/usage/walkthrough.md).
#
# Opaque-change fallback (ADR-0003): when the HCL parser cannot classify a construct
# (parse failure or unmodeled shape), the change is opaque → REVIEW — never silently
# proved/vouched. There is no opaque-change archetype under examples/archetypes/ yet
# (P1-E2 inventory gap); this pack documents the fallback here instead of inventing
# an obligation the inventory does not name (REQ-P3-E3-S02-03).
apiVersion: assent.dev/v1alpha1
kind: Config
environments:
  - name: prod
    match: { paths: ["envs/prod/**"] }
  - name: dev
    match: { paths: ["envs/**"] }
classes:
  - name: infra-vars
    # Terraform config files under envs/ are governed too (EX-S05), so they are never
    # silently un-reviewed change — but MEASURED (not assumed): the value-tree
    # producer dispatch (internal/change/diff.go's baseProducerFor) only routes the
    # tfvars extension to the HCL parser; every other extension, including this one,
    # defaults to the YAML producer, which cannot parse HCL syntax at all (block or
    # bare literal) and hits the opaque-change fallback above for a YAML-shaped
    # reason, not an HCL one. Every Terraform config file is opaque -> REVIEW today,
    # regardless of content — see the vars/tf-opaque case. Routing this extension to
    # the HCL producer (so a literal-only Terraform config file could structurally
    # diff, matching tfvars) is future engine work, not yet built.
    match: { paths: ["envs/**/*.tfvars", "envs/**/*.tf"] }
    # KNOWN LIMITATION (REF-EX C8, REF-GAP-3, out of v1 engine scope): this class
    # matches only *.tfvars and *.tf. A COMPANION file outside that match — e.g.
    # envs/prod/NOTES.md — is unclassified (ADR-0008 §1), and its deletion is
    # caught only by the class-agnostic D-063/D-064 unmatched-whole-file-DELETE
    # fail-safe (internal/core/aggregate/coverage.go), which raises the decision
    # to REVIEW with no obligation/rule attached (see vars/companion-delete in
    # .assent/tests/vars/cases.yaml — a MEASURED, not wished, REVIEW). This is
    # NOT cross-file correlation: the engine has no notion that NOTES.md is
    # "related" to compute.tfvars, and would REVIEW an unrelated companion
    # delete identically. v1 does not correlate "delete A and append B" across
    # files — that remains REF-GAP-3, likely out of v1 scope.
providers:
  author:
    type: builtin/gitlab-groups
    failure: closed
  band:
    type: http
    url: https://sizing.example.com/api/v1/bands
    failure: closed

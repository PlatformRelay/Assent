# Bounded-change — memory_mb / min_replicas / max_replicas within per-env bands.
# Over-band is acknowledgement (challenge), matching S01 bounded-change.
apiVersion: assent.dev/v1alpha1
kind: MergePolicy
metadata:
  name: vars-bounded-change
spec:
  entries:
    infra-vars:
      mode: map
      root: /workloads
  rules:
    - name: memory-mb-bounds
      match:
        valueChanges:
          pointers: ["/memory_mb"]
          kinds: [modify]
      prove:
        obligation: bounded-change
        when:
          all:
            - cel: new >= facts.band.memory_mb.min
              message: "memory_mb {{ new }} below band min {{ facts.band.memory_mb.min }}"
            - cel: new <= facts.band.memory_mb.max
              message: "memory_mb {{ new }} exceeds band max {{ facts.band.memory_mb.max }}"
      points: 1
      onFailure:
        effect: challenge
        code: bounded-change.out-of-band
    - name: min-replicas-bounds
      match:
        valueChanges:
          pointers: ["/min_replicas"]
          kinds: [modify]
      prove:
        obligation: bounded-change
        when:
          all:
            - cel: new >= facts.band.min_replicas.min
            - cel: new <= facts.band.min_replicas.max
      points: 1
      onFailure:
        effect: challenge
        code: bounded-change.out-of-band
    - name: max-replicas-bounds
      match:
        valueChanges:
          pointers: ["/max_replicas"]
          kinds: [modify]
      prove:
        obligation: bounded-change
        when:
          all:
            - cel: new >= facts.band.max_replicas.min
            - cel: new <= facts.band.max_replicas.max
            - cel: new >= entry.min_replicas
              message: "max_replicas must be >= min_replicas"
      points: 1
      onFailure:
        effect: challenge
        code: bounded-change.out-of-band

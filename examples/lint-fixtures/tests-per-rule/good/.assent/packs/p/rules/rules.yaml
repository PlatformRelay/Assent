apiVersion: assent.dev/v1alpha1
kind: MergePolicy
metadata:
  name: base
spec:
  rules:
    - name: base-ok
      phase: enforce
      match:
        files:
          paths: ["**/*.yaml"]
      prove:
        obligation: safe
        when: 'kind == "modify"'
      onFailure:
        effect: require-review
        code: needs.review

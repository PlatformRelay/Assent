# GoReleaser v2 config for assent (E9-S02, D-100).
# Local dry-run: task release-snapshot (--skip=sign,sbom — no OIDC locally)
# Tag-triggered publish + signing: E9-S05/E9-S06 (.github/workflows/release.yaml, D-109)
version: 2

project_name: assent

before:
  hooks:
    - go mod tidy

builds:
  - id: assent
    main: ./cmd/assent
    binary: assent
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# SPDX SBOM per archive (syft); SBOMs are included in checksums.txt (D-109).
sboms:
  - id: archive-sbom
    artifacts: archive
    cmd: syft
    documents:
      - "${artifact}.spdx.json"
    args: ["${artifact}", "--output", "spdx-json=${document}"]

# Cosign keyless via GitHub Actions OIDC — active on tagged release only (not local snapshot).
signs:
  - id: archive-sign
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: archive
  - id: checksum-sign
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  disable: true

release:
  disable: true

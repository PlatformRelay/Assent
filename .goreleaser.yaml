# GoReleaser v2 config for assent (E9-S02, D-100).
# Local dry-run: task release-snapshot
# Tag-triggered publish: E9-S05 (.github/workflows/release.yaml)
version: 2

project_name: assent

before:
  hooks:
    - go mod tidy

builds:
  - id: assent
    main: ./cmd/assent
    binary: assent
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  disable: true

release:
  disable: true

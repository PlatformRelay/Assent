# GoReleaser v2 config for assent (E9-S02, D-100).
# Local dry-run: task release-snapshot (--skip=publish,sign,sbom,homebrew — no OIDC/tap locally)
# Tag-triggered publish + signing: E9-S05/E9-S06 (.github/workflows/release.yaml, D-109)
# Homebrew tap push (E9-S07b, D-107): needs PlatformRelay/homebrew-tap + HOMEBREW_TAP_GITHUB_TOKEN
version: 2

project_name: assent

before:
  hooks:
    - go mod tidy

builds:
  - id: assent
    main: ./cmd/assent
    binary: assent
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# SPDX SBOM per archive (syft); SBOMs are included in checksums.txt (D-109).
sboms:
  - id: archive-sbom
    artifacts: archive
    cmd: syft
    documents:
      - "${artifact}.spdx.json"
    args: ["${artifact}", "--output", "spdx-json=${document}"]

# Cosign keyless via GitHub Actions OIDC — active on tagged release only (not local snapshot).
signs:
  - id: archive-sign
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: archive
  - id: checksum-sign
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

# Homebrew Formula → PlatformRelay/homebrew-tap (D-107, E9-S07b).
# Tagged release pushes when HOMEBREW_TAP_GITHUB_TOKEN is set and the tap repo exists.
# In-repo review copy: hack/release/homebrew/assent.rb.template
brews:
  - name: assent
    ids:
      - assent
    repository:
      owner: PlatformRelay
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/PlatformRelay/assent"
    description: "Policy lint and test CLI for Kubernetes admission and CI"
    license: "Apache-2.0"
    skip_upload: '{{ not (isEnvSet "HOMEBREW_TAP_GITHUB_TOKEN") }}'
    test: |
      system "#{bin}/assent", "version"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"

changelog:
  disable: true

release:
  disable: true

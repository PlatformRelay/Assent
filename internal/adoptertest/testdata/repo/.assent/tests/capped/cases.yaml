# Inline shorthand (E6-S06, frozen #/$defs/casesFile). Each case is one field-level
# edit of a single file whose contents live INLINE — no base/↔head/ directory tree.
# Every case feeds the SAME assembler + matcher a directory case does: the inline
# base/head are marshaled to config.json's format and diffed by the PRODUCTION
# change.Diff, then evaluated through aggregate.Cover. `expect` reuses the exact
# #/$defs/expectation shape the directory-case expect.yaml uses.
cases:
  # partitions 12 -> 16, within the resolved cap 32 -> obligation proven -> APPROVE.
  # The directory sibling capped/within-cap encodes the identical edit as files.
  - name: partition-increase-ok
    file: config.json
    base: { partitions: 12 }
    head: { partitions: 16 }
    facts: { limits: { maxPartitions: 32 } }
    expect: { decision: APPROVE }

  # partitions 12 -> 64 exceeds the resolved cap 32 -> the challenge fires -> REVIEW.
  - name: partition-increase-over-cap
    file: config.json
    base: { partitions: 12 }
    head: { partitions: 64 }
    facts: { limits: { maxPartitions: 32 } }
    expect:
      decision: REVIEW
      findings:
        - rule: partitions-within-cap
          obligation: capped
          effect: challenge
      score: { total: 1, threshold: 4 }

  # New-file case: base is null (the file did not exist on the target branch). One-
  # sided presence mints a clean whole-file ADD event (EFE-S02). The capped pack
  # governs no fileEvents, and an ADD is non-destructive — the unmatched-delete
  # escalation is DELETE-only (D-063) — so the ungoverned add earns APPROVE. (A
  # newly-added file's CONTENTS are a single lifecycle event, not value-level changes,
  # so the value-cap rule does not scrutinize them; the EFE whole-file semantics.)
  - name: new-file
    file: config.json
    base: null
    head: { partitions: 16 }
    facts: { limits: { maxPartitions: 32 } }
    expect: { decision: APPROVE }

  # Deleted-file case: head is null (the MR removes the file). One-sided presence mints
  # a clean whole-file DELETE event (EFE-S02). No fileEvents rule in the capped pack
  # governs it, so the S02 fail-safe escalation (Judgment call (a) / D-063, D-064)
  # raises the decision to REVIEW — a destructive delete no rule covers is never
  # silently approved.
  - name: deleted-file
    file: config.json
    base: { partitions: 16 }
    head: null
    facts: { limits: { maxPartitions: 32 } }
    expect: { decision: REVIEW }

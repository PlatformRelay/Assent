    level: L1
    req: REQ-AUD-S01-04
    test: TestRunEnumerationIncompleteNeverApproves
    package: cmd/assent
    forge: gitlab
    adapters: [gitlab]
    note: truncated enumeration → REVIEW changeset.undecidable, one thread, zero approve/merge. GitHub disposition — the cmd-level run-path cases run through the forge-agnostic orchestration; the forge-specific shape (refs/pull, GITHUB_TOKEN scopes) is exercised by the GitHub adapter unit tests + conformance factory; the live-pull_request workflow trust proof remains S18 (catalog row github-pull-request-fork-advisory)


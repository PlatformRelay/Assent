    note: S00 Q4 table row 403-with-x-ratelimit-remaining-0-or-Retry-After — a rate-limited 403 is a transport error is a transport error (retried and errored, never forge.ErrNotFound nor forge.ErrUnauthorized). Executed as a direct entry test a direct entry test (sentinel_cases_test.go) over the GitLab and GitHub factories — the fake has no transport to violate — so the row is not a RunSuite row and keeps this package's not-in-denominator marker (the transport-rows disposition).


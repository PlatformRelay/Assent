version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    labels: [dependencies]
  # AUD-S14 / SEC-01: the stock schema validator is lockfile-pinned, so it needs
  # an updater — an unwatched lockfile is a pin that rots into a stale-CVE pin.
  - package-ecosystem: npm
    directory: /hack/schemas-validator
    schedule:
      interval: weekly
    labels: [dependencies]

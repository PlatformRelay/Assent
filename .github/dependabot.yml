version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      # init, analyze and upload-sarif must move together: a run that mixes versions
      # fails with a configuration version mismatch.
      codeql-action:
        patterns: ["github/codeql-action/*"]
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    labels: [dependencies]
  # AUD-S14 / SEC-01: the stock schema validator is lockfile-pinned, so it needs
  # an updater — an unwatched lockfile is a pin that rots into a stale-CVE pin.
  - package-ecosystem: npm
    directory: /hack/schemas-validator
    schedule:
      interval: weekly
    labels: [dependencies]

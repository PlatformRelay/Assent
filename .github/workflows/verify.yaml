# CI gate set (security review A-10): lint incl. gosec, secrets, vulns, tests+coverage.
name: verify
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly release exit gate — goreleaser snapshot is too heavy for every PR (RELSE-03).
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # go.mod stays the minimum; CI runs latest stable (govulncheck needs it)
      - run: go vet ./...
      - run: go vet -tags e2e ./... # compile+vet e2e-tagged wiring (test/e2e, P4-E1-S09)
      - name: golangci-lint (incl. gosec)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2 # matches the v2 config schema in .golangci.yml
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      # Scope to HEAD history only — fetch-depth:0 still downloads sibling lane refs;
      # default gitleaks walks them and lane canaries must not red main CI.
      - name: gitleaks # CLI directly — gitleaks-action requires a paid license for org repos
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 detect --source . --no-banner --redact --log-opts="HEAD"
      - name: sanitization check (D-002, REQ-E7-S05-01)
        run: bash hack/check-sanitization.sh
      - run: go test -race ./...
      # E7-S04 — determinism gate (P4-E1-S12): double-run named engine + conformance goldens.
      # Keep this block distinct — E7-S05 adds sanitization steps below/after.
      - name: determinism gate (E7-S04 — P4-E1-S12 double-run)
        run: |
          go test -count=2 ./internal/core/aggregate/... -run 'TestDeterminismDoubleRun|TestD016ReproductionDoubleRunStable'
          go test -count=2 ./internal/core/decision/... -run TestReportDoubleRunStable
          go test -count=2 ./internal/forge/conformance/... -run 'TestConformanceTargetAdvancedRejected|TestConformanceRerunIdempotence|TestConformanceDuplicateRepair'
          go test -count=2 ./internal/forge/... -run TestMergeFailsClosedDoubleRun
          go test -count=2 ./internal/render/... -run 'TestRenderGoldens|TestRenderSummaryGolden'
      - name: coverage gate (>=90% on internal/, D-010)
        run: |
          if ls internal/*/*.go >/dev/null 2>&1; then
            go test -coverprofile=cov.out ./internal/...
            pct=$(go tool cover -func=cov.out | awk '/^total:/ {gsub("%","",$3); print $3}')
            echo "coverage: ${pct}% (required: 90%)"
            awk -v p="$pct" 'BEGIN { exit (p+0 >= 90 ? 0 : 1) }'
          else
            echo "no internal packages yet — gate armed, not applicable"
          fi
      - run: CGO_ENABLED=0 go build ./...
      - name: dogfood examples (P5-E6-S08 — every non-locked pack gates itself green under the real `assent test` CLI)
        run: |
          CGO_ENABLED=0 go build -o bin/assent ./cmd/assent
          for pack in service-catalog infra-vars topic-registry; do
            ./bin/assent test "examples/packs/$pack"
            ./bin/assent test --coverage "examples/packs/$pack"
          done
      - name: comparison corpus dogfood (PCS-S08 — examples/comparison validates and runs green)
        run: go test ./examples/comparison/...
      - name: install Task (exit gate scripts)
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: PCS compare exit gate (RELSE-03 — REQ-PCS-S09)
        run: bash hack/compare/exitgate_test.sh

  # RELSE-03: release exit gate includes goreleaser snapshot + docs-build — main push and
  # weekly schedule only; PRs run compare-exitgate above without this job.
  release-exitgate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: E9 release exit gate (RELSE-03 — REQ-E9-S13)
        run: bash hack/release/exitgate_test.sh

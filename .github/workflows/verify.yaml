# CI gate set (security review A-10): lint incl. gosec, secrets, vulns, tests+coverage.
name: verify
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly release exit gate — goreleaser snapshot is too heavy for every PR (RELSE-03).
    - cron: "0 6 * * 1"
permissions:
  contents: read
# AUD-S09 / SEC-04: single source for the Task version. Both jobs below install
# Task; pinning it here (workflow scope) is what stops them skewing, and what
# stops a mutable floating upstream release changing gate behaviour under CI.
# hack/lint/workflow_pins_test.sh asserts exactly one such definition exists,
# that it is a literal vX.Y.Z, and that every `cmd/task@` site interpolates it.
# (That gate bans the floating-tag token outright, comments included — hence the
# wording here.)
# AUD-S18 / D-128 precedent: golangci-lint is now needed in TWO jobs — the verify
# job lints through the action, and release-exitgate needs the BINARY on PATH
# because `task check` (which the audit exit gate runs) includes `task lint` and
# `lint-depguard-test`, and the action leaves nothing on PATH for a later step
# (D-125). Single-sourced here for the same reason TASK_VERSION is: two literals
# is how the coverage floor skewed.
# D-158: this pin is COUPLED to the Go toolchain `go-version: stable` resolves
# to below. golangci-lint typechecks the standard library with the go/types it
# was COMPILED with, so a linter release predating a Go release cannot read that
# Go's stdlib — v2.12.2 (built with go1.26.x) reddened every PR, including
# zero-Go Markdown diffs, the day `stable` rolled 1.26 -> 1.27.0. Diagnosis
# heuristic: golangci-lint's own go.mod carries `go 1.N-1` with the comment "the
# minimum Go version must always be latest-1", so a release whose go.mod says
# `go 1.N` supports Go 1.N+1. Failure signature: `(typecheck) could not import`
# on paths rooted in /opt/hostedtoolcache/go/1.N.0/. Fix = bump this line.
env:
  TASK_VERSION: v3.52.0
  GOLANGCI_LINT_VERSION: v2.13.1
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history
          persist-credentials: false # AUD-S14 / SEC-03 — nothing in this job pushes
      # AUD-S09 (SEC-04) — pure text gate over .github/workflows/**; no
      # toolchain, so it runs first and fails in seconds.
      - name: workflow supply-chain pins (AUD-S09 — SEC-04)
        run: bash hack/lint/workflow_pins_test.sh
      - name: dogfood + -count=1 wiring pin (EX-S08 — REQ-EX-S08-02/03)
        # RELSE-08, following the AUD2-S05 precedent below. This gate otherwise
        # reaches CI only through `task check` -> release-exitgate, whose
        # `if: github.event_name != 'pull_request'` means a PR that strips
        # `-count=1` from THIS FILE would merge green and redden main
        # afterwards — the gate's own thesis failing to apply to the gate.
        # Pure text over Taskfile.yml + this workflow, no toolchain, so it
        # belongs here beside workflow_pins_test.sh and before setup-go.
        # Keep it argument-free and undisarmed: the script asserts its own step
        # (section 7) is present, unargumented and free of
        # `if:`/`continue-on-error:`, so weakening this reddens it. These
        # comment lines live INSIDE the step on purpose, as the AUD2 step
        # documents.
        run: bash hack/examples/dogfood_wiring_test.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # go.mod stays the minimum; CI runs latest stable (govulncheck needs it)
      - name: AUD2 exit gate (AUD2-S05 — REQ-AUD2-S05-01..05)
        # The four 2026-08-18 remediations (REL-01/02/07, REL-03, SEC-03,
        # TEST-02) are still present. It runs HERE, in the job that fires on
        # pull_request — NOT only in release-exitgate, whose
        # `if: github.event_name != 'pull_request'` is RELSE-08, the blind spot
        # that let AUD-S18's stale CHECK_STAGES pin merge green four times.
        # POSITION IS LOAD-BEARING: this gate runs `go test` against reverted
        # copies of the tree, so it must come AFTER actions/setup-go. It sat
        # above it until now — with `toolchain go1.26.6` in go.mod the first
        # `go test` would have had to download a toolchain with no Go cache
        # present, and this branch has never had a CI run to reveal it.
        # Keep it undisarmed and argument-free: the gate asserts its own step
        # carries no `if:`/`continue-on-error:` and no arguments (`--text-only`
        # would skip the behavioural runs), so weakening this reddens it.
        # These comment lines live INSIDE the step on purpose — hack/lint/
        # workflow_pins_test.sh isolates the step ABOVE up to the next `- `
        # marker and caps it at six lines.
        run: bash hack/audit/aud2_exitgate_test.sh
      - run: go vet ./...
      - run: go vet -tags e2e ./... # compile+vet e2e-tagged wiring (test/e2e, P4-E1-S09)
      - name: golangci-lint (incl. gosec)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Single-sourced with release-exitgate's `go install` (workflow env
          # GOLANGCI_LINT_VERSION); matches the v2 config schema in .golangci.yml.
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      # Scope to HEAD history only — fetch-depth:0 still downloads sibling lane refs;
      # default gitleaks walks them and lane canaries must not red main CI.
      - name: gitleaks # CLI directly — gitleaks-action requires a paid license for org repos
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 detect --source . --no-banner --redact --log-opts="HEAD"
      - name: sanitization check (D-002, REQ-E7-S05-01)
        run: bash hack/check-sanitization.sh
      # REDMAIN-N1 / D-168 (REQ-REDMAIN-N1-02) — commit subjects must not lead with
      # a LITERAL emoji: cliff.toml's parsers key on the ASCII gitmoji shortcode, so
      # such a subject matches none of them and is published under "### Other" on the
      # Release page (the REL-14/D-137 defect through another door). Deliberately NOT
      # guarded off pull_request, unlike the changelog drift gate below (D-125/OQ-30):
      # a PR is the LAST moment the subject can still be reworded, because hard rule 2
      # forbids rewriting it once it is on main. Needs the full history the gitleaks
      # comment above already requires (fetch-depth: 0); no argument — the argument
      # form is the sandbox mode that skips the published-history exemption checks.
      # Also runs locally in `task check` via hack/release/changelog_gate_test.sh §9,
      # which is where both of its polarities are proved.
      - name: commit subject gate (REDMAIN-N1 — no literal emoji, D-168)
        run: bash hack/release/commit_subject_gate.sh
      - run: go test -race ./...
      # E7-S04 — determinism gate (P4-E1-S12): double-run named engine + conformance goldens.
      # Keep this block distinct — E7-S05 adds sanitization steps below/after.
      - name: determinism gate (E7-S04 — P4-E1-S12 double-run)
        run: |
          go test -count=2 ./internal/core/aggregate/... -run 'TestDeterminismDoubleRun|TestD016ReproductionDoubleRunStable'
          go test -count=2 ./internal/core/decision/... -run TestReportDoubleRunStable
          go test -count=2 ./internal/forge/conformance/... -run 'TestConformanceTargetAdvancedRejected|TestConformanceRerunIdempotence|TestConformanceDuplicateRepair'
          go test -count=2 ./internal/forge/... -run TestMergeFailsClosedDoubleRun
          go test -count=2 ./internal/render/... -run 'TestRenderGoldens|TestRenderSummaryGolden'
      - name: install Task (coverage + exit gate scripts)
        run: go install github.com/go-task/task/v3/cmd/task@"${TASK_VERSION}"
      # AUD-S13 / D-128 — the coverage floor is SINGLE-SOURCED in Taskfile.yml's
      # `coverage:` task (var COVERAGE_MIN). This step used to re-implement the gate
      # inline with its own copy of the threshold, so raising the local floor left CI
      # silently enforcing the previous one — the skew that actually shipped.
      # Delegating to `task coverage` means the threshold exists in exactly ONE place
      # and the two halves cannot drift again. Do not re-inline the shell here;
      # change COVERAGE_MIN in Taskfile.yml instead.
      - name: coverage gate (D-010 — threshold single-sourced from Taskfile.yml)
        run: task coverage
      # D-177 — CI-based SonarCloud analysis. Automatic Analysis was disabled on
      # 2026-08-04 and the scanner half of that migration was never built, so the
      # project sat a month with NO analysis of any kind while every SONAR-* row in
      # the backlog kept citing figures frozen at that date. Running the scanner as a
      # workflow step is what turns "no analysis" into a VISIBLE red instead of
      # silence — an analyser outside the gate matrix is worth nothing here.
      # PLACEMENT IS LOAD-BEARING: `task coverage` above writes cov.out, which
      # sonar.go.coverage.reportPaths reads. Moving this step before it reports 0%
      # coverage to SonarCloud without failing. hack/lint/workflow_pins_test.sh pins
      # both the step's presence and this ordering.
      # NOT continue-on-error, deliberately: that is the disarm shape the audit gates
      # refuse, and it would rebuild the exact silence this step exists to end.
      # Fork PRs carry no SONAR_TOKEN, so the step is skipped there rather than
      # hard-failing. That is a real coverage gap, recorded in D-177 rather than
      # papered over.
      - name: SonarCloud analysis (D-150/D-177 — CI-based; replaces Automatic Analysis)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - run: CGO_ENABLED=0 go build ./...
      - name: dogfood examples (EX-S08 — shared discovery script; every examples/packs/<name> with .assent/tests gates itself green under the real `assent test` CLI)
        run: bash hack/dogfood-examples.sh
      - name: comparison corpus dogfood (PCS-S08 — examples/comparison validates and runs green)
        # -count=1 IS THE GATE, exactly as in Taskfile.yml's dogfood-comparison.
        # examples/comparison is an EXTERNAL test package referencing only
        # exported constants from internal/compare, so the compare logic is
        # unreachable from the test binary the Go cache keys on (the linker
        # strips it) and the real logic runs in a `go build -o … ./cmd/assent`
        # subprocess outside the cache key. actions/setup-go restores GOCACHE
        # across commits, so without this flag this step reports `ok … (cached)`
        # and contributes NOTHING to the PR: not the JSON-schema validation of
        # the suite docs, not the corpusGateCoverage gate-ID map, not
        # TestCompareCorpusGateFailurePath. (The corpus OUTCOME stays defended
        # on PRs by hack/compare/exitgate_test.sh, which drives the built binary
        # through bash with no Go test cache in the path.) Fix it HERE, per
        # invocation — do NOT "fix" it by setting `cache: false` on setup-go:
        # that would slow every job in every workflow to close one blind
        # invocation. Pinned by hack/examples/dogfood_wiring_test.sh.
        run: go test -count=1 ./examples/comparison/...
      - name: PCS compare exit gate (RELSE-03 — REQ-PCS-S09)
        run: bash hack/compare/exitgate_test.sh
      # AUD-S02 (REQ-AUD-S02-02) — CHANGELOG.md drift gate, main + schedule only.
      # NOT on pull_request. D-125's reason for that guard was the synthetic merge
      # subject on refs/pull/N/merge; D-136 skips merge commits, so that reason is
      # DEAD, and its proposed successor ("the merge ref is a union the branch's file
      # cannot match") was measured and is FALSE — see OQ-30 for all three
      # measurements. The guard is retained without a demonstrated reason on purpose:
      # changing CI gating needs its own evidence, and it is fail-safe either way
      # because `task check` runs this gate on every local commit and push-to-main is
      # the backstop. Do not delete this line to "clean up a dead premise" — close
      # OQ-30 first.
      - name: changelog drift gate (AUD-S02 — REQ-AUD-S02-02)
        if: github.event_name != 'pull_request'
        run: task changelog-verify

  # RELSE-03: release exit gate includes goreleaser snapshot + docs-build — main push and
  # weekly schedule only; PRs run compare-exitgate above without this job.
  release-exitgate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # AUD-S18: this job now also runs the audit exit gate, which runs a full
    # `task check` plus the determinism double-run. Bounded so a hung gate does
    # not sit on a runner for six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # AUD-S18: the audit exit gate's schema-freeze check is REF-RELATIVE —
          # it diffs schemas/**/*.json against the immutable v0.1.0 tag, because
          # a working-tree diff is silent on committed schema changes (D-132).
          # A shallow checkout has no tags, so the gate would be unable to
          # resolve its baseline and would fail closed.
          fetch-depth: 0
          # AUD-S14 / SEC-03 — the exit-gate scripts build and verify artifacts
          # locally; none of them pushes, so the token must not stay in .git/config.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # docs-install (task docs-build) requires uv; docs.yaml uses pip — this job mirrors local Task.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: install Task
        run: go install github.com/go-task/task/v3/cmd/task@"${TASK_VERSION}"
      # AUD-S18: `task check` runs `task lint` and `lint-depguard-test`, both of
      # which need the golangci-lint BINARY on PATH. The verify job lints via the
      # action, which leaves nothing behind for a later step (D-125), so the exit
      # gate needs its own pinned install. Version single-sourced at workflow level.
      - name: install golangci-lint (AUD-S18 — task check needs it on PATH)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"${GOLANGCI_LINT_VERSION}"
      - name: E9 release exit gate (RELSE-03 — REQ-E9-S13)
        run: bash hack/release/exitgate_test.sh
      # AUD-S18 (REQ-AUD-S18-01/02) — the P5-AUD exit gate: the 2026-08-06 audit's
      # conditions closed, EVERY `task check` stage green, coverage at the raised
      # bar, the frozen JSON schemas unchanged against the v0.1.0 tag, and every
      # audit finding dispositioned. Invoked with NO arguments on purpose:
      # `--text-only` skips the toolchain layer, and the gate's own CI-wiring check
      # reds if this line ever grows an argument, an `if:` or a `continue-on-error:`.
      # DOCTRUTH / D-174: no stage COUNT is quoted above. The single source is that
      # script's own CHECK_STAGES array, which the gate asserts the Taskfile `check:`
      # list is EQUAL to; a number restated in prose is graded by nothing, and this
      # one went stale twice — it read "14" until AUD2-S05 and "19" until D-174, by
      # which time the array had already reached 21.
      - name: AUD audit exit gate (AUD-S18 — REQ-AUD-S18-01/02)
        run: bash hack/audit/exitgate_test.sh

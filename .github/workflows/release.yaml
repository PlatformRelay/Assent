# Tag-triggered GitHub Release publish (E9-S05) + cosign/SBOM/SLSA (E9-S06, D-109).
name: release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - ".github/workflows/release.yaml"
      - ".goreleaser.yaml"
      - "cmd/assent/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.0.0-test); rebuilds assets without cutting a new tag"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  snapshot:
    name: goreleaser snapshot (dry-run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: GoReleaser snapshot (no publish credentials)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.9.0
          args: release --snapshot --clean --skip=publish,sign,sbom,homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: publish
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # cosign keyless signing (OIDC)
      attestations: write # SLSA provenance via actions/attest
      actions: read # AUD-S03: read the verify workflow's runs for the tag SHA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # REQ-AUD-S03-01/02: first step that does anything — nothing is built, signed, or
      # published unless `verify` concluded success on this tag's commit. Applies to the
      # workflow_dispatch rebuild path too (it is not a bypass). Only checkout precedes it,
      # because the gate logic lives in a repo script (REQ-AUD-S03-02 asserts the order).
      - name: Verify is green on the tag SHA (release gate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ inputs.tag }}
        run: bash hack/release/verify-tag-gate.sh

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${TAG_INPUT}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag must look like vX.Y.Z (got ${TAG})" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Build release assets
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.9.0
          # Do NOT --skip=publish: that also skips Homebrew tap push. GH Release stays
          # disabled via .goreleaser.yaml release.disable; softprops publishes assets below.
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tap push (E9-S07b): skip_upload when HOMEBREW_TAP_GITHUB_TOKEN unset.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Attest GitHub Release assets (SLSA provenance)
        id: attest-release
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/checksums.txt

      - name: Export release provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest-release.outputs.bundle-path }}
        run: cp "${BUNDLE_PATH}" dist/release-provenance.intoto.jsonl

      - name: Generate release notes (git-cliff)
        id: cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          version: v2.13.1
          config: cliff.toml
          # NOT `--strip header`. The changelog header is where cliff.toml keeps
          # the long-lived "Compatibility notes" (D-120: `pins.toolDigest`
          # changes value after v0.1.0). Stripping it put those notes in
          # CHANGELOG.md but not in the Release body, so a consumer reading only
          # the Release page got no warning that a published record field
          # changed derivation. The header is the ONLY carrier for such notes —
          # CHANGELOG.md is regenerated in full from commit history, so a
          # hand-edit cannot hold them.
          args: --latest
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: assent ${{ steps.version.outputs.version }}
          body: ${{ steps.cliff.outputs.content }}
          files: |
            dist/checksums.txt
            dist/*.tar.gz
            dist/*.zip
            dist/*.spdx.json
            dist/*.sigstore.json
            dist/release-provenance.intoto.jsonl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
